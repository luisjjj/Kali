name: Desktop app

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer as a release
        type: boolean
        default: true
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable zip
        run: npm run desktop:dist

      - name: Keep the Windows builds as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: kali-windows-build
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || 'desktop-latest' }}
          name: Kali for Windows
          body: |
            Kali for Windows, 64-bit.

            Pick one download:

            - **Installer:** `Kali-Setup-*.exe`. It installs for the current user and adds a Start menu shortcut.
            - **Portable ZIP:** `Kali-*.zip`. Unzip it and run `Kali.exe`. No installation needed. Use this if the installer is blocked or hangs.

            Windows may warn that the app is unrecognised because the build is not code signed yet: pick "More info", then "Run anyway".

            If the installer still hangs, close any running Kali or Kali Setup process, delete a partial `%LOCALAPPDATA%\Programs\Kali` folder, and try again. The ZIP is the fallback.

            The desktop app is a small, locked down window for the Kali website. Camera, microphone and screen sharing stay on your device; the call server only ever sees the call itself.
          files: |
            release/*.exe
            release/*.zip
          fail_on_unmatched_files: true
