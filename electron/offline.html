<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Kali</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffb3cd;
        --ink: #171412;
        --muted: #6f4a58;
        --accent: #171412;
        --accent-hover: #000000;
        --surface: #fffbf9;
        --line: rgba(23, 20, 18, 0.14);
        --line-dot: rgba(23, 20, 18, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: var(--bg);
        background-image: radial-gradient(var(--line-dot) 1px, transparent 1px);
        background-size: 26px 26px;
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 36px 36px 32px;
        text-align: center;
        box-shadow: 0 20px 50px -30px rgba(23, 20, 18, 0.4);
      }
      .mark {
        margin: 0 0 20px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.055em;
      }
      .dot {
        color: var(--accent);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
      }
      button {
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fffbf9;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 24px;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0b;
          --ink: #f7f5f2;
          --muted: #a8a09a;
          --accent: #ff77a6;
          --accent-hover: #ff8fb5;
          --surface: #141416;
          --line: rgba(255, 255, 255, 0.1);
          --line-dot: rgba(255, 255, 255, 0.06);
        }
        button {
          color: #171412;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="mark">kali<span class="dot">.</span></p>
      <h1>Can&apos;t reach Kali</h1>
      <p>Check your internet connection, then try again. Calls need a network anyway.</p>
      <button id="retry" type="button">Try again</button>
    </div>
    <script>
      var target =
        new URLSearchParams(window.location.search).get("url") ||
        "https://kali-one-snowy.vercel.app/desktop";
      document.getElementById("retry").addEventListener("click", function () {
        window.location.replace(target);
      });
    </script>
  </body>
</html>
