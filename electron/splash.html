<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Kali</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffa2c0;
        --ink: #171412;
        --muted: #68424f;
        --accent: #171412;
        --line: rgba(23, 20, 18, 0.13);
        --track: rgba(23, 20, 18, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: var(--bg);
        background-image: radial-gradient(var(--line) 1px, transparent 1px);
        background-size: 26px 26px;
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .splash {
        width: 100%;
        padding: 36px 44px;
        text-align: center;
      }
      .platform {
        margin: 0 0 18px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .mark {
        margin: 0;
        font-size: 52px;
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 1;
      }
      .dot {
        color: var(--accent);
      }
      .tagline {
        margin: 12px 0 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }
      .loader {
        width: 148px;
        height: 4px;
        margin: 26px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: var(--track);
      }
      .loader::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        animation: slide 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0b;
          --ink: #f7f5f2;
          --muted: #a8a09a;
          --accent: #ff77a6;
          --line: rgba(255, 255, 255, 0.08);
          --track: rgba(255, 255, 255, 0.1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <p class="platform">Kali for Windows</p>
      <p class="mark">kali<span class="dot">.</span></p>
      <p class="tagline">Getting your call ready</p>
      <div class="loader" aria-hidden="true"></div>
    </div>
  </body>
</html>
